<header class="app-header">
  <a routerLink="/" class="logo">🎁 HamperCo</a>

  <nav class="nav-links">
    <a routerLink="/products" routerLinkActive="active">All Products</a>
    <a routerLink="/wishlist" routerLinkActive="active">Wishlist</a>
  </nav>

  <a routerLink="/cart" class="cart-link">
    🛒 Cart
    <!-- @if (cartStore.itemCount() > 0) { -->
      <span class="cart-badge">{{ cartStore.itemCount() }}</span>
    <!-- } -->
  </a>

  @if (authStore.isLoggedIn()) {
    <div class="user-menu">
      <span>{{ authStore.currentUser()?.name }}</span>
      <button (click)="onLogout()">Logout</button>
    </div>
  } @else {
    <a routerLink="/login" class="login-link">Login</a>
  }
</header>
