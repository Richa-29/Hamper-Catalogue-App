<div class="listing-container" appPullToRefresh (refresh)="onRefresh()">
  <div class="toolbar">
    <app-product-filters />
    <app-search-box />
    <div class="toolbar-right">
      <button class="refresh-btn" (click)="onRefresh()" [disabled]="productStore.isLoading()">
        <span [class.spinning]="productStore.isLoading()">🔄</span>
      </button>
      <app-product-sort />
    </div>
  </div>

  @if (productStore.isLoading()) {
    <app-loading-skeleton [count]="8" />
  } @else if (productStore.error()) {
    <p class="error">{{ productStore.error() }}</p>
  } @else {
    <div class="product-grid">
      @for (product of products(); track product.id) {
        <app-product-card [product]="product" />
      }
    </div>
  }
</div>
