<div class="cart-summary">
  <h3>Order Summary</h3>

  <div class="summary-row">
    <span>Items ({{ cartStore.itemCount() }})</span>
    <span>₹{{ cartStore.subtotal() }}</span>
  </div>

  <div class="summary-row total">
    <span>Total</span>
    <span>₹{{ cartStore.subtotal() }}</span>
  </div>

  <a routerLink="/checkout" class="checkout-btn">Proceed to Checkout</a>
</div>
